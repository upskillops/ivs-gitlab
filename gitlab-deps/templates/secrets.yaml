{{- $ns := .Release.Namespace -}}
{{- $pg := include "deps.secretValue" (dict "ns" $ns "name" "gitlab-postgresql-password" "key" "password") -}}
{{- $redis := include "deps.secretValue" (dict "ns" $ns "name" "gitlab-redis-password" "key" "password") -}}
{{- $external := eq .Values.objectStore "external" -}}
{{- $s3user := "" -}}
{{- $s3pass := "" -}}
{{- $endpoint := "" -}}
{{- if $external -}}
{{-   $s3user = required "external.accessKey is required (deploy.sh: export S3_ACCESS_KEY)" .Values.external.accessKey -}}
{{-   $s3pass = required "external.secretKey is required (deploy.sh: export S3_SECRET_KEY)" .Values.external.secretKey -}}
{{-   $endpoint = required "external.endpoint is required" .Values.external.endpoint -}}
{{- else -}}
{{-   $s3user = include "deps.secretValue" (dict "ns" $ns "name" "gitlab-minio-root" "key" "user") -}}
{{-   $s3pass = include "deps.secretValue" (dict "ns" $ns "name" "gitlab-minio-root" "key" "password") -}}
{{-   $endpoint = ternary (printf "http://gitlab-s3.%s.svc:8333" $ns) (printf "http://gitlab-minio.%s.svc:9000" $ns) (eq .Values.objectStore "seaweedfs") -}}
{{- end -}}
{{- $s3host := regexReplaceAll "^https?://" $endpoint "" -}}
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-postgresql-password
  annotations: { helm.sh/resource-policy: keep }
stringData:
  password: {{ $pg | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-redis-password
  annotations: { helm.sh/resource-policy: keep }
stringData:
  password: {{ $redis | quote }}
{{- if not $external }}
---
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-minio-root
  annotations: { helm.sh/resource-policy: keep }
stringData:
  user: {{ $s3user | quote }}
  password: {{ $s3pass | quote }}
{{- end }}
---
# Consolidated object storage connection for GitLab Rails (fog format)
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-object-storage
stringData:
  connection: |
    provider: AWS
    region: {{ .Values.s3Region }}
    aws_access_key_id: {{ $s3user }}
    aws_secret_access_key: {{ $s3pass }}
    endpoint: {{ $endpoint }}
    path_style: true
    aws_signature_version: 4
    {{- if and $external .Values.external.disableStreamingSignature }}
    enable_signature_v4_streaming: false
    {{- end }}
---
# Container Registry storage driver config
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-registry-storage
stringData:
  config: |
    s3_v2:
      bucket: {{ .Values.registryBucket }}
      accesskey: {{ $s3user }}
      secretkey: {{ $s3pass }}
      region: {{ .Values.s3Region }}
      regionendpoint: {{ $endpoint }}
      pathstyle: true
---
# s3cmd config used by toolbox backups
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-backup-storage
stringData:
  config: |
    [default]
    access_key = {{ $s3user }}
    secret_key = {{ $s3pass }}
    bucket_location = {{ .Values.s3Region }}
    host_base = {{ $s3host }}
    host_bucket = {{ $s3host }}
    use_https = {{ ternary "True" "False" (hasPrefix "https://" $endpoint) }}
    signature_v2 = False
{{- if eq .Values.objectStore "seaweedfs" }}
---
# SeaweedFS S3 identities: same generated keys as gitlab-minio-root above.
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-s3-config
stringData:
  s3.json: |
    {
      "identities": [
        {
          "name": "gitlab",
          "credentials": [{ "accessKey": {{ $s3user | quote }}, "secretKey": {{ $s3pass | quote }} }],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        }
      ]
    }
{{- end }}
