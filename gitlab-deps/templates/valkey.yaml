apiVersion: v1
kind: Service
metadata:
  name: gitlab-redis
spec:
  selector: { app: gitlab-redis }
  ports: [{ name: redis, port: 6379 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gitlab-redis
spec:
  serviceName: gitlab-redis
  replicas: 1
  selector:
    matchLabels: { app: gitlab-redis }
  template:
    metadata:
      labels: { app: gitlab-redis }
    spec:
      securityContext: { fsGroup: 999 }
      containers:
        - name: valkey
          image: {{ .Values.valkey.image }}
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: gitlab-redis-password, key: password } }
          command: ["sh", "-c", "exec valkey-server --requirepass \"$REDIS_PASSWORD\" --appendonly yes --dir /data"]
          ports: [{ name: redis, containerPort: 6379 }]
          readinessProbe:
            exec: { command: ["sh", "-c", "valkey-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"] }
            periodSeconds: 10
            timeoutSeconds: 5
          resources: {{- toYaml .Values.valkey.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- include "deps.storageClass" . | nindent 8 }}
        resources: { requests: { storage: {{ .Values.valkey.size }} } }
