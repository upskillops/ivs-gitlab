# Istio ingress gateway (chart istio/gateway 1.31.2) on OKE: public OCI LB on the reserved IP.
#   helm upgrade istio-ingress istio/gateway -n istio-ingress --version 1.31.2 -f oci/helm/istio-ingress-values.yaml
# IDs come from the oke-private Terraform outputs (reserved_public_ips, public_lb_subnet_id, public_lb_nsg_id).
service:
  type: LoadBalancer
  externalTrafficPolicy: Local
  loadBalancerIP: 137.23.58.128
  ports:
    - { name: status-port, port: 15021, protocol: TCP, targetPort: 15021 }
    - { name: http2, port: 80, protocol: TCP, targetPort: 80 }
    - { name: https, port: 443, protocol: TCP, targetPort: 443 }
    - { name: tcp-gitlab-ssh, port: 22, protocol: TCP, targetPort: 22 }   # GitLab Git over SSH
  annotations:
    oci.oraclecloud.com/load-balancer-type: "lb"
    service.beta.kubernetes.io/oci-load-balancer-internal: "false"
    service.beta.kubernetes.io/oci-load-balancer-subnet1: "ocid1.subnet.oc1.ap-mumbai-1.aaaaaaaagrqwn3skhj7ojiqgkkwg7mnokwsykeppghy4cwictjlpmq6w6bja"
    oci.oraclecloud.com/oci-network-security-groups: "ocid1.networksecuritygroup.oc1.ap-mumbai-1.aaaaaaaahvdcilj3itf4qasisb7v5klovluqunwxpb7bd7g6kln3z27tbera"
    service.beta.kubernetes.io/oci-load-balancer-security-list-management-mode: "None"
    service.beta.kubernetes.io/oci-load-balancer-shape: "flexible"
    service.beta.kubernetes.io/oci-load-balancer-shape-flex-min: "10"
    service.beta.kubernetes.io/oci-load-balancer-shape-flex-max: "100"

# One gateway pod per node so every LB backend passes the Local health check.
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 5
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        istio: ingress
