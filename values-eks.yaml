# Overrides for Amazon EKS. Use with: -f values.yaml -f values-eks.yaml
# Requires the AWS Load Balancer Controller (provisions the NLB) and a gp3 StorageClass.

gatewayApiResources:
  envoy:
    proxySpec:
      provider:
        kubernetes:
          envoyService:
            annotations:
              service.beta.kubernetes.io/aws-load-balancer-type: external
              service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
              service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
